name: Deploy AstroZone to DigitalOcean

on:
  push:
    branches:
      - main  # Se activa al subir cambios a la rama principal

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Despliegue por SSH en Loraine-Web
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/workspace/AstroZone
            git pull origin main
            docker compose up -d --build

