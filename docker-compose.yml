services:
  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: astrozone-nginx-proxy
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro

  frontend:
    build: ./frontend
    expose:
      - "80"
    environment:
      - VIRTUAL_HOST=astrozone.local
      - VIRTUAL_PORT=80
    depends_on:
      - backend

  backend:
    build: ./backend
    expose:
      - "8000"
    environment:
      - VIRTUAL_HOST=api.astrozone.local
      - VIRTUAL_PORT=8000
      - ALLOWED_ORIGINS=http://astrozone.local
    volumes:
      - ./backend:/app
